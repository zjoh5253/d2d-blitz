services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: d2d_user
      POSTGRES_PASSWORD: d2d_password
      POSTGRES_DB: b2b_blitz
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2d_user -d b2b_blitz"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: "postgresql://d2d_user:d2d_password@db:5432/b2b_blitz"
      AUTH_SECRET: "local-dev-secret-change-in-production"
      NEXTAUTH_URL: "http://localhost:3003"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
