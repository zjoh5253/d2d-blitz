name: API Test Suite

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    # Real Postgres so endpoints exercise the DB instead of 500ing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: d2d_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/d2d_test
      # NextAuth requires a secret or auth() throws 500 on every request.
      AUTH_SECRET: ci-test-secret-not-used-in-production-0123456789abcdef
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_ENV: test
      APP_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        # No postinstall hook in package.json, so a clean `npm ci` does not
        # generate the client; without it every route importing @prisma/client
        # 500s with "Cannot find module '.prisma/client/default'".
        run: npx prisma generate

      - name: Sync database schema
        # db push (not migrate deploy): creates the schema on the empty test DB
        # without depending on migration history.
        run: npx prisma db push --accept-data-loss

      - name: Start dev server
        # Dev server avoids build-time prerender/env pitfalls; routes compile on
        # demand and the readiness poll below absorbs first-request latency.
        run: npm run dev > /tmp/server.log 2>&1 &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Server ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server did not become ready in 90s"
          cat /tmp/server.log || true
          exit 1

      - name: Run API test suite
        run: node scripts/api-test-suite.js --base-url=http://localhost:3000

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/server.log || true

  test-api-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API test suite against production
        run: node scripts/api-test-suite.js --base-url=https://d2d-blitz.vercel.app
        continue-on-error: true  # Smoke-only; never blocks on prod availability
